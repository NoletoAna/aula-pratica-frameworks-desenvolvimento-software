<html>
    <head>
        <title>Cadastre-se</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container-md col-md-6" id="principal">
            <form method="POST" name="formEndereco" id="formEndereco">
                <h2 class="text-center">ENDEREÇO</h2>

                <div class="row g-2 mb-3">
                    <!-- CEP -->
                    <div class="col-md-5"><div class="input-group input-group-sm">
                        <span class="input-group-text">CEP</span>
                        <input type="text" id="cep" class="form-control" maxlength="9" placeholder="Ex: 86025230">
                        </div>
                    </div>
                    <!-- Rua -->
                    <div class="col-md-7"><div class="input-group input-group-sm">
                        <span class="input-group-text">Rua</span>
                        <input type="text" id="rua" class="form-control" placeholder="Ex: Rua Tietê">
                        </div>
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <!-- Bairro -->
                    <div class="col-md-4"><div class="input-group input-group-sm">
                        <span class="input-group-text">Bairro</span>
                        <input type="text" id="bairro" class="form-control" placeholder="Ex: Jardim">
                        </div>
                    </div>
                    <!-- Cidade -->
                    <div class="col-md-5"><div class="input-group input-group-sm">
                        <span class="input-group-text">Cidade</span>
                        <input type="text" id="cidade" class="form-control" placeholder="Ex: Londrina">
                        </div>
                    </div>
                    <!-- Estado -->
                    <div class="col-md-3"><div class="input-group input-group-sm">
                        <span class="input-group-text">Estado</span>
                        <input type="text" id="estado" class="form-control" maxlength="2" placeholder="PR">
                        </div>
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <!-- Número -->
                    <div class="col-md-5"><div class="input-group input-group-sm">
                        <span class="input-group-text">Número</span>
                        <input type="text" id="numero" class="form-control" placeholder="Ex: 103">
                        </div>
                    </div>
                    <!-- Complemento -->
                    <div class="col-md-7"><div class="input-group input-group-sm">
                        <span class="input-group-text">Complemento</span>
                        <input type="text" id="complemento" class="form-control">
                        </div>
                    </div>
                </div>

                <p id="mensagem" class="text-danger text-center small"></p>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-sm">CADASTRAR</button>
                </div>
            </form>
        </div>

        <script src="controller.js"></script>
    </body>
</html>
