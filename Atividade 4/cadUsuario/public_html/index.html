<!DOCTYPE html>
<html>
    <head>
        <title>Cadastro de Cliente</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>
    </head>
    <body class="bg-light">
        <header class="bg-dark text-white text-center py-3 mb-4">
            <h1 class="h4 fw-bold m-0">Cadastro de Cliente</h1>
        </header>

        <main class="container mb-5">
            <div id="alerta" class="alert d-none" role="alert"></div>

            <form id="formCadastro" class="row g-3 bg-white border rounded shadow-sm p-4" novalidate>
                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nome" placeholder="Nome">
                    <div class="invalid-feedback">Informe o nome.</div>
                </div>
                <div class="col-md-6">
                    <label for="sobrenome" class="form-label">Sobrenome</label>
                    <input type="text" class="form-control" id="sobrenome" placeholder="Sobrenome">
                    <div class="invalid-feedback">Informe o sobrenome.</div>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="text" class="form-control" id="email" placeholder="nome@exemplo.com">
                    <div class="invalid-feedback" id="emailFeedback">Informe um e-mail válido.</div>
                </div>
                <div class="col-md-6">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha">
                    <div class="invalid-feedback">Informe a senha.</div>
                </div>

                <h2 class="h5 mt-4 mb-0">Endereço</h2>

                <div class="col-md-2">
                    <label for="cep" class="form-label">CEP</label>
                    <input type="text" class="form-control" id="cep" maxlength="9">
                    <div class="invalid-feedback" id="cepFeedback">Informe o CEP.</div>
                </div>
                <div class="col-md-6">
                    <label for="rua" class="form-label">Rua</label>
                    <input type="text" class="form-control" id="rua" placeholder="Rua">
                    <div class="invalid-feedback">Informe a rua.</div>
                </div>
                <div class="col-md-4">
                    <label for="bairro" class="form-label">Bairro</label>
                    <input type="text" class="form-control" id="bairro" placeholder="Bairro">
                    <div class="invalid-feedback">Informe o bairro.</div>
                </div>
                <div class="col-md-4">
                    <label for="cidade" class="form-label">Cidade</label>
                    <input type="text" class="form-control" id="cidade">
                    <div class="invalid-feedback">Informe a cidade.</div>
                </div>
                <div class="col-md-2">
                    <label for="estado" class="form-label">Estado</label>
                    <input type="text" class="form-control" id="estado" maxlength="2">
                    <div class="invalid-feedback">Informe o estado.</div>
                </div>
                <div class="col-md-2">
                    <label for="numero" class="form-label">Número</label>
                    <input type="text" class="form-control" id="numero">
                    <div class="invalid-feedback">Informe o número.</div>
                </div>
                <div class="col-md-4">
                    <label for="complemento" class="form-label">Complemento</label>
                    <input type="text" class="form-control" id="complemento">
                    <div class="invalid-feedback">Informe o complemento.</div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-dark btn-sm">Verificar</button>
                </div>
            </form>
        </main>

        <script src="main.js"></script>
        <script src="validation.js"></script>
    </body>
</html>
